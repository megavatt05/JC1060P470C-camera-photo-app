name: ESP32-P4 Firmware Build CI (v6.0.3)

on:
  push:
    branches: [ "main", "master", "feature/ethernet-browser" ]
  pull_request:
    branches: [ "main", "master", "feature/ethernet-browser" ]
  workflow_dispatch: 

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set Target Chip to ESP32-P4
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4

      - name: Build Project
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32p4-binaries
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
