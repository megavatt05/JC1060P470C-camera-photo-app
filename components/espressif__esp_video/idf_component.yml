dependencies:
  cmake_utilities: 0.*
  esp_cam_sensor:
    version: 1.3.*
  esp_h264:
    rules:
    - if: target in [esp32p4]
    version: 1.0.4
  esp_ipa:
    rules:
    - if: target in [esp32p4]
    version: ~1.1.0
  idf: '>=5.4'
  usb_host_uvc:
    rules:
    - if: target in [esp32p4, esp32s3]
    version: 2.3.0
