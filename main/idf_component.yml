dependencies:
  idf: '>=5.4'

  # Keep 1.2.x — compatible with local esp_cam_sensor 1.2.1 (OV02C10).
  # esp_video 2.x requires esp_cam_sensor 2.6+ which has no OV02C10.
  esp_video:
    version: "~1.2.0"
    public: true

  # IDF 6.0+: 1.3.1 fixes #include "hal/isp_types.h" compilation
  espressif/esp_ipa:
    version: ">=1.3.1,<2.0.0"

  # Required on ESP-IDF 6.0+ for USB Serial/JTAG / HS tooling on P4
  espressif/usb:
    version: "*"

  espressif/esp_lcd_ek79007:
    version: 1.*
    public: true
  espressif/esp_lcd_jd9365: "^1.0.2"
  espressif/esp_lcd_jd9165: "*"
  espressif/esp_lcd_st7701: "*"
