dependencies:
  idf: '>=5.4'

  # IDF v6 moved the 802.3 Ethernet PHY drivers out of esp_eth into the
  # registry; on IDF 5.x the IP101 driver is still part of esp_eth itself.
  espressif/ip101:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"

  espressif/esp_lcd_ek79007:
    version: 1.*
    public: true
  espressif/esp_lcd_jd9365: "^1.0.2"
  espressif/esp_lcd_jd9165: "*"
  espressif/esp_lcd_st7701: "*"
