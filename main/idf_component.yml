dependencies:
  idf: '>=5.4'

  esp_video:
    version: "~1.2.0"
    public: true

  espressif/usb:
    version: "*"

  # IDF v6 moved SPI Ethernet chip drivers out of esp_eth into the registry;
  # on IDF 5.x the W5500 driver is still part of esp_eth itself.
  espressif/w5500:
    version: "^2.0.0"
    rules:
      - if: "idf_version >=6.0"

  espressif/esp_lcd_ek79007:
    version: 1.*
    public: true
  espressif/esp_lcd_jd9365: "^1.0.2"
  espressif/esp_lcd_jd9165: "*"
  espressif/esp_lcd_st7701: "*"
