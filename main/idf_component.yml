dependencies:
  idf: '>=5.4'

  # IDF v6 moved the 802.3 Ethernet PHY drivers out of esp_eth into the
  # registry; on IDF 5.x the IP101 driver is still part of esp_eth itself.
  espressif/ip101:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"

  espressif/esp_lcd_ek79007:
    version: 1.*
    public: true
  espressif/esp_lcd_jd9365: "^1.0.2"
  espressif/esp_lcd_jd9165: "*"
  espressif/esp_lcd_st7701: "*"

  # --- Media: internet radio + video playback (main/media/) ---
  espressif/esp_player:
    version: "1.0.7"
  espressif/esp_audio_render:
    version: "1.0.0"
  espressif/esp_video_render:
    version: "1.0.0"
  espressif/esp_video_codec:
    version: "~0.5"
  espressif/esp_extractor:
    version: "~1.0"
  espressif/gmf_core:
    version: "1.0.2"
  espressif/gmf_audio:
    version: "1.0.1"
  espressif/gmf_video:
    version: "1.0.3"
  espressif/gmf_io:
    version: "1.0.0"
  espressif/esp_codec_dev:
    version: "1.6.2"
  espressif/media_lib_sal:
    version: "~1.0"

  # Wi-Fi on P4 via ESP32-C6 (SDIO). menuconfig: Wi-Fi Remote → slave = esp32c6
  espressif/esp_wifi_remote:
    version: "*"
  espressif/esp_hosted:
    version: "*"
